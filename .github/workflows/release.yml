name: 🦋 Changesets Release
on:
  push:
    branches:
      - release
      - "release-*"
      - "!release-experimental"
      - "!release-experimental-*"
      - "!release-manual"
      - "!release-manual-*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 🦋 Changesets Release
    if: github.repository == 'mcansh/vite-plugin-svg-sprite'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-toolchain
        with:
          cache: "false"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Open version PR or publish release
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run changeset:version
          commit-message: "chore: Update version for release"
          pr-title: "chore: Update version for release"
          publish-script: pnpm run changeset:release
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  comment:
    name: 📝 Comment on issues and pull requests
    if: github.repository == 'mcansh/vite-plugin-svg-sprite' && needs.release.outputs.published == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Comment on issues and pull requests
        uses: remix-run/release-comment-action@a30a8b833fbed247f079f065c093f48b47f16c03 # v0.5.1
        with:
          DIRECTORY_TO_CHECK: "./packages"
          PACKAGE_NAME: "@mcansh/vite-plugin-svg-sprite"
